description = "Rewrite a request into the prompt that gets the best answer"
prompt = "Do not answer the request, rewrite it into the prompt that gets the best possible answer. State the real goal in one line if it differs from the literal ask, reframe toward what a world-class expert in the domain would actually ask, list only the gaps that would materially change the output and fill them with sane defaults, then write the prompt as role, task, context, constraints, output format, and quality bar. Output exactly: an optional '**Real goal:**' line, an optional '**Assumptions:**' line (max 3 bullets), then the rewritten prompt. Omit either line entirely if there is nothing to add, never write filler like 'Assumptions: none'."
