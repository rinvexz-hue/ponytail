name: kolibri
on:
  push:
    paths: ["kolibri/**", ".github/workflows/kolibri.yml"]
  pull_request:
    paths: ["kolibri/**", ".github/workflows/kolibri.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kolibri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - name: tests (coverage gate on risk + execution)
        run: >
          pytest -q -p no:warnings
          --cov=kolibri --cov-report=term
          --cov-fail-under=85
      - name: risk + execution coverage >= 85 %
        run: coverage report --include="*/risk/*,*/executioner/*" --fail-under=85
