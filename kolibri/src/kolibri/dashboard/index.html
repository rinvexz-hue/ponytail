<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLIBRI desk</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --line: #e4e3de;
  --ink: #0b0b0b; --ink2: #52514e; --ink3: #7a7975;
  --series: #2a78d6;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --line: #2e2e2c;
    --ink: #ffffff; --ink2: #c3c2b7; --ink3: #8e8d86; --series: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --line: #2e2e2c;
  --ink: #ffffff; --ink2: #c3c2b7; --ink3: #8e8d86; --series: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 2; }
h1 { font-size: 16px; margin: 0; letter-spacing: .08em; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); margin: 0 0 10px; }
main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.wide { grid-column: 1 / -1; }
.kpis { display: flex; flex-wrap: wrap; gap: 18px; }
.kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--ink2); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--ink2); font-weight: 500; font-size: 12px; }
.scroll { overflow-x: auto; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ink3)); }
.good { --dot: var(--good); } .warning { --dot: var(--warning); } .critical { --dot: var(--critical); }
.actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; cursor: pointer; min-height: 40px; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
button.kill { background: var(--critical); color: #fff; border-color: var(--critical); font-weight: 700; letter-spacing: .06em; }
input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--page); color: var(--ink); min-width: 0; }
#chart { position: relative; }
#chart svg { width: 100%; height: 220px; display: block; }
#tip { position: absolute; pointer-events: none; background: var(--page); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; white-space: nowrap; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; }
.bar-track { height: 10px; }
.bar { height: 10px; border-radius: 0 4px 4px 0; background: var(--series); min-width: 2px; }
.muted { color: var(--ink2); }
.alert { padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
#msg { color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>KOLIBRI</h1>
  <span id="mode" class="chip">—</span>
  <span id="halt" class="chip">—</span>
  <div class="actions">
    <label class="muted" for="tok" style="align-self:center">token</label>
    <input id="tok" type="password" autocomplete="off" placeholder="DASHBOARD_TOKEN">
    <button id="ack">ACK alerts</button>
    <button id="rearm">Re-arm</button>
    <button id="flatten">FLATTEN</button>
    <button id="kill" class="kill">KILL</button>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
</header>
<main>
  <section class="wide"><div class="kpis" id="kpis"></div></section>
  <section class="wide">
    <h2>Symbols · regime · what blocks trading now</h2>
    <div class="scroll"><table><thead><tr><th>Symbol</th><th>Regime</th><th>Gate</th><th>Feed</th><th>Tick age</th><th>Reconnects</th></tr></thead><tbody id="syms"></tbody></table></div>
  </section>
  <section class="wide">
    <h2>Open positions</h2>
    <div class="scroll"><table><thead><tr><th>Symbol</th><th>Dir</th><th>Setup</th><th>Qty</th><th>Entry</th><th>Stop</th><th>Mark</th><th>R</th><th>TP1</th><th>Age</th></tr></thead><tbody id="pos"></tbody></table></div>
  </section>
  <section class="wide">
    <h2>Equity (last 24h of bars)</h2>
    <div id="chart"><svg id="svg" role="img" aria-label="Equity curve"></svg><div id="tip"></div></div>
  </section>
  <section><h2>Today</h2><div id="today"></div></section>
  <section><h2>Rejections by gate (today)</h2><div id="rej"></div></section>
  <section><h2>Health</h2><div id="health"></div></section>
  <section><h2>Alerts</h2><div id="alerts"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (x, d = 2) => (x == null || isNaN(x)) ? "—" : Number(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
try { $("tok").value = sessionStorage.getItem("kolibri_tok") || ""; } catch (e) {}
$("tok").addEventListener("change", () => { try { sessionStorage.setItem("kolibri_tok", $("tok").value); } catch (e) {} });
const hdr = () => ({ Authorization: "Bearer " + $("tok").value });

async function act(path, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  const r = await fetch(path, { method: "POST", headers: hdr() });
  $("msg").textContent = r.ok ? JSON.stringify(await r.json()) : "error " + r.status;
  refresh();
}
$("kill").onclick = () => act("/api/kill", "KILL: flatten everything and halt until manual re-arm?");
$("flatten").onclick = () => act("/api/flatten", "Flatten all positions now?");
$("rearm").onclick = () => act("/api/rearm", "Re-arm trading? Only after you understand why it halted.");
$("ack").onclick = () => act("/api/ack");

function kpis(s) {
  const t = s.today || {};
  const items = [["Equity", fmt(s.equity)], ["Drawdown from peak", fmt(s.drawdown_pct) + "%"],
    ["Day PnL", fmt(s.day_pnl_pct) + "%"], ["Trades today", t.trades ?? 0], ["Sum R today", fmt(t.sum_r)],
    ["Intents today", t.intents ?? 0], ["Clock drift", fmt(s.clock_drift_ms, 0) + " ms"], ["Unacked CRITICAL", s.unacked]];
  $("kpis").innerHTML = items.map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${esc(v)}</b></div>`).join("");
}

function chart(pts) {
  const svg = $("svg"), W = svg.clientWidth || 600, H = 220, P = {l: 64, r: 12, t: 10, b: 24};
  if (!pts || pts.length < 2) { svg.innerHTML = `<text x="12" y="24" fill="var(--ink2)">waiting for bars…</text>`; return; }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = xs[0], x1 = xs[xs.length - 1], lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * 0.1 || 1;
  const X = (x) => P.l + (x - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = (y) => P.t + (1 - (y - lo + pad) / (hi - lo + 2 * pad)) * (H - P.t - P.b);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  const ticks = [lo, (lo + hi) / 2, hi];
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>
      <text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink2)">${fmt(v)}</text>`).join("") +
    `<path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
     <line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--ink3)" visibility="hidden"/>
     <circle id="dot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
     <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" id="hit"/>`;
  const tip = $("tip");
  $("hit").onmousemove = (e) => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let i = 0; for (let k = 0; k < pts.length; k++) if (Math.abs(X(pts[k][0]) - mx) < Math.abs(X(pts[i][0]) - mx)) i = k;
    const px = X(pts[i][0]), py = Y(pts[i][1]);
    $("xh").setAttribute("x1", px); $("xh").setAttribute("x2", px); $("xh").setAttribute("visibility", "visible");
    $("dot").setAttribute("cx", px); $("dot").setAttribute("cy", py); $("dot").setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.style.left = Math.min(px * r.width / W + 8, r.width - 160) + "px"; tip.style.top = "8px";
    tip.textContent = new Date(pts[i][0]).toISOString().slice(11, 16) + " UTC · " + fmt(pts[i][1]);
  };
  $("hit").onmouseleave = () => { tip.style.display = "none"; $("xh").setAttribute("visibility", "hidden"); $("dot").setAttribute("visibility", "hidden"); };
}

function render(s) {
  $("mode").textContent = s.mode.toUpperCase(); $("mode").className = "chip " + (s.mode === "live" ? "critical" : "good");
  $("halt").textContent = s.halted ? "HALTED: " + s.halted : "armed"; $("halt").className = "chip " + (s.halted ? "critical" : "good");
  kpis(s);
  const syms = Object.keys({...s.regimes, ...s.health}).sort();
  $("syms").innerHTML = syms.map(k => { const h = s.health[k] || {}; const g = s.gates[k] || "—";
    return `<tr><td>${esc(k)}</td><td>${esc(s.regimes[k] || "—")}</td>
      <td><span class="chip ${g.startsWith("open") ? "good" : "warning"}">${esc(g)}</span></td>
      <td><span class="chip ${h.connected ? "good" : "critical"}">${h.connected ? "live" : "down"}</span></td>
      <td>${h.tick_age_s ?? "—"}s</td><td>${h.reconnects ?? 0}</td></tr>`; }).join("");
  $("pos").innerHTML = s.positions.length ? s.positions.map(p => `<tr><td>${esc(p.symbol)}</td><td>${esc(p.direction)}</td><td>${esc(p.setup)}</td>
      <td>${esc(p.qty)}</td><td>${esc(p.entry)}</td><td>${esc(p.stop)}</td><td>${esc(p.mark)}</td><td><b>${fmt(p.r)}</b></td>
      <td>${p.tp1_done ? "done" : "—"}</td><td>${p.age_s}s</td></tr>`).join("") : `<tr><td colspan="10" class="muted">flat — no trade is a valid trade</td></tr>`;
  chart(s.curve);
  const t = s.today || {};
  $("today").innerHTML = `<table><tbody><tr><td>Trades</td><td>${t.trades ?? 0} (${t.wins ?? 0} wins)</td></tr>
     <tr><td>Avg R</td><td>${fmt(t.avg_r)}</td></tr><tr><td>PnL</td><td>${fmt(t.pnl)}</td></tr>
     <tr><td>Kill events</td><td>${esc((t.kills || []).join("; ") || "none")}</td></tr></tbody></table>`;
  const rej = Object.entries(s.rejections || {}), mx = Math.max(1, ...rej.map(r => r[1]));
  $("rej").innerHTML = rej.length ? rej.map(([g, n]) => `<div class="bar-row" title="${esc(g)}: ${n}"><span>${esc(g)}</span>
      <div class="bar-track"><div class="bar" style="width:${n / mx * 100}%"></div></div><span>${n}</span></div>`).join("") : `<span class="muted">none yet</span>`;
  $("health").innerHTML = `<table><tbody><tr><td>Clock drift</td><td>${fmt(s.clock_drift_ms, 0)} ms</td></tr>
      <tr><td>Late trades dropped</td><td>${s.late_trades}</td></tr><tr><td>Curve max DD (window)</td><td>${fmt(s.curve_max_dd_pct)}%</td></tr></tbody></table>`;
  $("alerts").innerHTML = (s.alerts || []).slice().reverse().map(a => `<div class="alert"><span class="chip ${a.sev === "CRITICAL" ? "critical" : a.sev === "WARN" ? "warning" : "good"}">${esc(a.sev)}</span>
      ${esc(a.text)} <span class="muted">${new Date(a.ts * 1000).toISOString().slice(11, 19)}</span></div>`).join("") || `<span class="muted">none</span>`;
}

async function refresh() {
  if (!$("tok").value) { $("msg").textContent = "enter DASHBOARD_TOKEN"; return; }
  try {
    const r = await fetch("/api/state", { headers: hdr() });
    if (!r.ok) { $("msg").textContent = "state: " + r.status; return; }
    render(await r.json());
  } catch (e) { $("msg").textContent = "desk unreachable"; }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
