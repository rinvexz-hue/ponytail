# Venue capabilities and per-symbol filters. Live mode re-reads tick / lot / minimum order size
# from Kraken at start and refuses to run if they differ from these (`kolibri check-live` shows them).
venues:
  kraken:
    supports_short: false       # spot; Kraken margin shorts stay off (check what you may legally use)
    supports_reduce_only: false # spot: open sells reserve balance, so stop + TP cannot both rest
    max_leverage: "1"
    # Kraken Pro spot tiers changed on 2026-07-09 (best of 30d volume / futures volume / assets on
    # platform). Entry tier (< $2.5k volume) is 0.40 % maker / 0.80 % taker. Put YOUR tier here;
    # `kolibri check-live` prints the rates Kraken actually charges your account.
    maker_fee: "0.004"
    taker_fee: "0.008"
    fee_discount: "0"
  paper:
    supports_short: false
    supports_reduce_only: false
    max_leverage: "1"
    maker_fee: "0.004"
    taker_fee: "0.008"
    fee_discount: "0"

# tick = price step, step = lot step, min_qty = Kraken ordermin, min_notional = Kraken costmin.
# spread/impact are the backtest/paper model when no live book is available.
symbols:
  BTCEUR: {base: BTC, tick: "0.1",     step: "0.00000001", min_qty: "0.00005", min_notional: "0.5", spread_bps: "0.5", impact_bps: "1.0"}
  ETHEUR: {base: ETH, tick: "0.01",    step: "0.00000001", min_qty: "0.001",   min_notional: "0.5", spread_bps: "0.8", impact_bps: "1.5"}
  SOLEUR: {base: SOL, tick: "0.01",    step: "0.00000001", min_qty: "0.02",    min_notional: "0.5", spread_bps: "2.0", impact_bps: "3.0"}
  XRPEUR: {base: XRP, tick: "0.00001", step: "0.00000001", min_qty: "2",       min_notional: "0.5", spread_bps: "2.0", impact_bps: "3.0"}
